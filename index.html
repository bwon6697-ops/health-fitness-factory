<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beast Mode On | Health & Fitness Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FFFFFF;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: 'Bebas Neue', cursive;
        }

        .word-container { text-align: center; line-height: 0.85; }

        .word {
            font-size: clamp(4rem, 15vw, 9rem);
            color: #000;
            letter-spacing: 0.1em;
            opacity: 0;
            transform: translateY(-100vh);
            display: block;
        }

        .word.yellow { color: #FFD700; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }

        .word.drop { animation: gravityDrop 1s cubic-bezier(0.19, 1, 0.22, 1) forwards; }

        @keyframes gravityDrop {
            0% { transform: translateY(-100vh); opacity: 0; }
            30% { opacity: 1; }
            60% { transform: translateY(0); }
            75% { transform: translateY(-30px); }
            85% { transform: translateY(0); }
            95% { transform: translateY(-10px); }
            100% { transform: translateY(0); opacity: 1; }
        }

        .tap-text {
            font-family: 'Rajdhani', sans-serif;
            margin-top: 30px;
            font-size: 1rem;
            color: #999;
            letter-spacing: 0.5em;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-transform: uppercase;
        }

        .shake { animation: shake 0.4s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
        }

        #footer {
            position: fixed;
            bottom: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            color: #CCC;
            letter-spacing: 0.3em;
        }
    </style>
</head>
<body onclick="redirect()">
    <div class="word-container" id="mainContainer">
        <span class="word" id="w1">BEAST</span>
        <span class="word" id="w2">MODE</span>
        <span class="word yellow" id="w3">ON</span>
    </div>
    <p class="tap-text" id="tap">TAP TO ENTER</p>
    <div id="footer">HEALTH & FITNESS FACTORY • MEHNAGAR</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // BEAST drops
            setTimeout(() => document.getElementById('w1').classList.add('drop'), 500);
            // MODE drops
            setTimeout(() => document.getElementById('w2').classList.add('drop'), 1500);
            // ON drops + Shake
            setTimeout(() => {
                document.getElementById('w3').classList.add('drop');
                setTimeout(() => {
                    document.body.classList.add('shake');
                }, 600);
            }, 2500);
            // Tap text
            setTimeout(() => document.getElementById('tap').style.opacity = '1', 4000);
        });

        function redirect() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 500);
        }
    </script>
</body>
</html>
