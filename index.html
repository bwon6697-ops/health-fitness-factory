<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Fitness Factory | Mehnagar</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Welcome to Health & Fitness Factory in Mehnagar. Premium gym facility for your fitness transformation. Beast Mode On.">
    <meta name="theme-color" content="#FFD700">
    <meta name="author" content="Harshit Barnwal">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables */
        :root {
            --yellow: #FFD700;
            --black: #000000;
            --white: #FFFFFF;
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--white);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        /* Center Content Container */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Yellow Circle */
        .circle {
            width: 100px;
            height: 100px;
            background-color: var(--yellow);
            border-radius: 50%;
            margin-bottom: 20px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s ease;
        }

        /* Main Heading */
        .title {
            font-family: 'Bebas Neue', cursive;
            font-size: 3rem;
            color: var(--black);
            letter-spacing: 2px;
            margin-bottom: 10px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Yellow Divider Line */
        .line {
            width: 0;
            height: 3px;
            background-color: var(--yellow);
            margin-bottom: 15px;
            transition: width 0.6s ease;
        }

        /* Small Tap Text */
        .tap {
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Bottom Footer Text */
        .footer {
            position: fixed;
            bottom: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #999;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 1s ease;
            text-transform: uppercase;
        }

        /* Animation Classes */
        .show {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        .line-grow {
            width: 60px !important;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .title { font-size: 2.5rem; }
            .circle { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <div class="content">
        <div id="circle" class="circle"></div>
        <h1 id="title" class="title">BEAST MODE ON</h1>
        <div id="line" class="line"></div>
        <p id="tap" class="tap">TAP TO ENTER</p>
    </div>

    <div id="footer" class="footer">
        HEALTH & FITNESS FACTORY &bull; MEHNAGAR
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.getElementById('circle');
            const title = document.getElementById('title');
            const line = document.getElementById('line');
            const tap = document.getElementById('tap');
            const footer = document.getElementById('footer');

            // Sequential Fade-in Animations
            setTimeout(() => {
                circle.classList.add('show');
            }, 300);

            setTimeout(() => {
                title.classList.add('show');
            }, 800);

            setTimeout(() => {
                line.classList.add('line-grow');
            }, 1300);

            setTimeout(() => {
                tap.classList.add('show');
                footer.classList.add('show');
            }, 1800);

            // Click anywhere to redirect
            document.body.addEventListener('click', () => {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 500);
            });

            // Accessibility: Enter key also works
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.body.click();
            });
        });
    </script>
</body>
</html>
